name: Validate EDP Definitions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-edps:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout bento-edps
        uses: actions/checkout@v4

      - name: Checkout bento-mdb
        uses: actions/checkout@v4
        with:
          repository: CBIIT/bento-mdb
          path: bento-mdb

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version-file: bento-mdb/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.10"

      - name: Install bento-mdb
        run: |
          uv pip install --system -e bento-mdb

      - name: Validate all EDP packages
        run: |
          make_edp_changelog \
            --edp_root model-desc/edps \
            --output_file /tmp/edp-validation.xml \
            --author "GitHub Actions" \
            --_commit "${{ github.sha }}"
